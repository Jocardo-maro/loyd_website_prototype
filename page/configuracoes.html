
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="/java/tts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="/java/aaa.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/losdicon.ico">
    <script src="/java/config.js"></script>
    <link rel="stylesheet" href="/style/config.css">

    <title>Configurações - Los Devs</title>
</head>

<body>

    <h1>Configurações</h1>

    <main class="config-container">

        <section class="config-item">

            <div class="config-controls">

                <div class="config-control">
                    <h2>Aparência</h2>

                    <p>Escolha o tema visual do site.</p>

                    <span id="themeStatus">Modo noite</span>

                    <button id="themeButton">
                        Alternar tema
                    </button>
                </div>

                <div class="config-control">
                    <h2>Arruine o site</h2>

                    <p>Destrua toda e qualquer barreira moral e psicológica que já existiu nesse site.</p>

                    <span id="fontStatus">Integridade visual restaurada</span>

                    <button id="fontButton">
                        ARRUINE O SITE
                    </button>

<div class="config-control">
    <h2>Modo AAA</h2>

    <p>Ative a experiência de acessibilidade exagerada.</p>

    <span id="aaaStatus">Modo AAA desativado</span>

    <button id="aaaButton">
        ATIVAR MODO AAA
    </button>
</div>
<label for="languageSelect">Idioma do narrador:</label>

<select id="languageSelect">
    <option value="pt-BR">Português</option>
    <option value="en-US">English</option>
</select>

                </div>

            </div>

            <button onclick="window.location.href='/page/mainsc.html'">
                Voltar
            </button>

        </section>

    </main>

</body>
</html>
